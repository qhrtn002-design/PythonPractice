<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>ThRead</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand bg-success" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand" href="{% url 'books:index' %}">ThRead</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="{% url 'books:index' %}">INDEX</a>
        {% if request.user.is_authenticated %}
          <a class="nav-link" href="{% url "books:create" %}">CREATE</a>
          <a class="nav-link" href="#">회원정보수정</a>
          <a class="nav-link" href="#">LOGOUT</a>
        {% else %}
          <a class="nav-link" href="#">LOGIN</a>
          <a class="nav-link" href="#">SIGNUP</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    {% block content %}
    {% endblock content %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
